services:
    api:
      container_name: api
      image: api
      build:
        context: ..
        dockerfile: ./Dockerfile
      ports:
        - 127.0.0.1:8000:8000
      command: uv run server.py --prod --workers 4 --workers-kill-timeout 30 --backlog 2048 --backpressure 2048
      env_file:
        - .env

    redis:
      container_name: redis
      image: redis
      command: --port 6380
      volumes:
        - redis_data:/data
      depends_on:
        - api

    celery:
      container_name: celery
      image: api
      command: celery -A src.common.infrastructure.workers.app worker -B --loglevel=DEBUG
      env_file:
        - ../.env
      links:
        - redis
      depends_on:
        - api
        - redis

    flower:
      container_name: flower
      image: mher/flower:latest
      command: ["celery", "--broker=redis", "flower", "--port=5555"]
      # extra_hosts:
      #   - "host.docker.internal:host-gateway"
      ports:
        - "127.0.0.1:5555:5555"
      depends_on:
        - redis

    prometheus:
      container_name: prometheus
      image: prom/prometheus:latest
      volumes:
        - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      ports:
        - "127.0.0.1:9090:9090"
      depends_on:
        - api

    grafana:
      container_name: grafana
      image: grafana/grafana:latest
      volumes:
        - ./dockers_files/grafana/datasources:/etc/grafana/provisioning/datasources
      ports:
        - "127.0.0.1:3000:3000"
      depends_on:
        - prometheus

volumes:
  redis_data:

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        run: uv python pin ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint with ruff
        run: uv run ruff check src/

      - name: Type check with pyright
        run: uv run pyright

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: el_rodeo_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DB_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/el_rodeo_test"
      REDIS_URL: "redis://localhost:6380/0"
      SECRET: "test-secret-not-for-production"
      JWT_ALGORITHM: "HS256"
      DOMAIN: "http://localhost:7000"
      SMTP_SERVER: "localhost"
      SMTP_PORT: 1025
      SMTP_USER: "test"
      SMTP_PASSWORD: "test"
      BROKER_URL: "redis://localhost:6380/0"
      RESULT_BACKEND_URL: "redis://localhost:6380/0"
      ENVIRONMENT: "development"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        run: uv python pin ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run migrations
        run: uv run python scripts/migrate.py

      - name: Run tests
        run: uv run pytest tests/unit -q --no-header

      - name: Run integration tests
        run: uv run pytest tests/integration -q --no-header
